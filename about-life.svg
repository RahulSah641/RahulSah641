<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="aAur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="aDots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".06"/></pattern>
</defs>
<style>.m{font-family:Consolas,Menlo,monospace}</style>
<!-- LEFT CARD -->
<rect x="0" y="0" width="440" height="320" rx="20" fill="#0d0e16"/><rect x="0" y="0" width="440" height="320" rx="20" fill="url(#aDots)"/>
<rect x=".5" y=".5" width="439" height="319" rx="19.5" fill="none" stroke="url(#aAur)" stroke-opacity=".5"/>
<text x="24" y="38" font-size="18" font-weight="700" fill="#e5e7eb">What I build</text>
<rect x="24" y="52" width="392" height="104" rx="10" fill="#11121c" stroke="#fff" stroke-opacity=".1"/>
<circle cx="40" cy="66" r="4" fill="#f87171"/><circle cx="54" cy="66" r="4" fill="#fbbf24"/><circle cx="68" cy="66" r="4" fill="#34d399"/>
<rect x="88" y="58" width="310" height="16" rx="8" fill="#ffffff" fill-opacity=".06"/>
<text x="100" y="70" font-size="10" fill="#9ca3af" class="m">rax-ai.local/ask?q=summarize</text>
<rect x="262" y="61" width="1.5" height="10" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<g class="m" font-size="11"><text x="40" y="100" fill="#a78bfa">query</text><text x="82" y="100" fill="#9ca3af">→ embed → HNSW search</text>
<text x="40" y="120" fill="#22d3ee">rag</text><text x="68" y="120" fill="#9ca3af">→ top-k chunks → answer</text>
<text x="40" y="140" fill="#f472b6">db</text><text x="62" y="140" fill="#9ca3af">→ SQLite persistence</text></g>
<g font-size="13" fill="#cbd5e1">
<rect x="24" y="172" width="32" height="32" rx="8" fill="#22d3ee" fill-opacity=".15"/><text x="40" y="194" text-anchor="middle" font-size="16">🧠</text>
<text x="68" y="185" font-weight="600">Machine Learning</text><text x="68" y="200" font-size="11" fill="#9ca3af">scikit-learn, NumPy, Pandas</text>
<rect x="24" y="216" width="32" height="32" rx="8" fill="#a78bfa" fill-opacity=".15"/><text x="40" y="238" text-anchor="middle" font-size="16">🔎</text>
<text x="68" y="229" font-weight="600">RAG &amp; Vector Search</text><text x="68" y="244" font-size="11" fill="#9ca3af">HNSW, KD-Tree, Ollama</text>
<rect x="24" y="260" width="32" height="32" rx="8" fill="#f472b6" fill-opacity=".15"/><text x="40" y="282" text-anchor="middle" font-size="16">🔒</text>
<text x="68" y="273" font-weight="600">Privacy-first Web Tools</text><text x="68" y="288" font-size="11" fill="#9ca3af">local processing, zero uploads</text>
</g>
<!-- RIGHT CARD -->
<g transform="translate(460,0)">
<rect width="440" height="320" rx="20" fill="#0d0e16"/><rect width="440" height="320" rx="20" fill="url(#aDots)"/>
<rect x=".5" y=".5" width="439" height="319" rx="19.5" fill="none" stroke="url(#aAur)" stroke-opacity=".5"/>
<text x="24" y="38" font-size="18" font-weight="700" fill="#e5e7eb">Beyond the code</text>
<!-- progress segments -->
<g>
<rect x="24" y="52" width="122" height="4" rx="2" fill="#fff" fill-opacity=".12"/><rect x="24" y="52" width="0" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="0;122;122;122;122" keyTimes="0;.33;.34;.99;1" dur="12s" repeatCount="indefinite"/></rect>
<rect x="159" y="52" width="122" height="4" rx="2" fill="#fff" fill-opacity=".12"/><rect x="159" y="52" width="0" height="4" rx="2" fill="#a78bfa"><animate attributeName="width" values="0;0;122;122;0" keyTimes="0;.33;.66;.99;1" dur="12s" repeatCount="indefinite"/></rect>
<rect x="294" y="52" width="122" height="4" rx="2" fill="#fff" fill-opacity=".12"/><rect x="294" y="52" width="0" height="4" rx="2" fill="#f472b6"><animate attributeName="width" values="0;0;0;122;0" keyTimes="0;.66;.67;.99;1" dur="12s" repeatCount="indefinite"/></rect>
</g>
<!-- slide 1 -->
<g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.31;.35;.99;1" dur="12s" repeatCount="indefinite"/>
<rect x="24" y="70" width="392" height="150" rx="12" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".3"/>
<text x="220" y="165" text-anchor="middle" font-size="64">🧮</text>
<text x="40" y="244" font-size="15" fill="#e5e7eb" font-weight="600">Grinding LeetCode</text><text x="40" y="262" font-size="12" fill="#9ca3af">Data structures &amp; algorithms, daily.</text></g>
<!-- slide 2 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.36;.64;.68;1" dur="12s" repeatCount="indefinite"/>
<rect x="24" y="70" width="392" height="150" rx="12" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/>
<text x="220" y="165" text-anchor="middle" font-size="64">📊</text>
<text x="40" y="244" font-size="15" fill="#e5e7eb" font-weight="600">Exploring data</text><text x="40" y="262" font-size="12" fill="#9ca3af">Charts, notebooks and curiosity.</text></g>
<!-- slide 3 -->
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.65;.69;.97;1" dur="12s" repeatCount="indefinite"/>
<rect x="24" y="70" width="392" height="150" rx="12" fill="#f472b6" fill-opacity=".08" stroke="#f472b6" stroke-opacity=".3"/>
<text x="220" y="165" text-anchor="middle" font-size="64">🎨</text>
<text x="40" y="244" font-size="15" fill="#e5e7eb" font-weight="600">Front-end play</text><text x="40" y="262" font-size="12" fill="#9ca3af">Small CodePen experiments.</text></g>
<!-- rings -->
<g transform="translate(300,282)" fill="none" stroke-width="4" stroke-linecap="round">
<g transform="translate(0,0)"><circle r="12" stroke="#fff" stroke-opacity=".1"/><circle r="12" stroke="#22d3ee" stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90)"><animate attributeName="stroke-dashoffset" values="75.4;15;15;75.4" keyTimes="0;.5;.9;1" dur="6s" repeatCount="indefinite"/></circle></g>
<g transform="translate(40,0)"><circle r="12" stroke="#fff" stroke-opacity=".1"/><circle r="12" stroke="#a78bfa" stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90)"><animate attributeName="stroke-dashoffset" values="75.4;30;30;75.4" keyTimes="0;.5;.9;1" dur="6s" repeatCount="indefinite"/></circle></g>
<g transform="translate(80,0)"><circle r="12" stroke="#fff" stroke-opacity=".1"/><circle r="12" stroke="#f472b6" stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90)"><animate attributeName="stroke-dashoffset" values="75.4;5;5;75.4" keyTimes="0;.5;.9;1" dur="6s" repeatCount="indefinite"/></circle></g>
</g>
</g>
</svg>
